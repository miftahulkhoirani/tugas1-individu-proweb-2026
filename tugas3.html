<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aritmatika Sederhana</title>
</head>
<style>
    .baris {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .baris label {
            width: 150px;
        }

        input {
            width: 300px;
            padding: 8px;
            box-sizing: border-box;
        }

     .tombol {
            margin-left: 190px;
            margin-bottom: 15px;
        }

        button {
            width: 45px;
            height: 35px;
            margin-right: 5px;
            font-size: 18px;
            cursor: pointer;
        }
          
</style>
<body>
    <h2>Aritmatika Sederhana</h2>

    <fieldset>
    <br>
    <div class="baris">
    <label for="bilangan1">Input Bilangan 1</label>
    <input type="number" id="bilangan1">
    </div>
    <div class="baris">
    <label for="bilangan2">Input Bilangan 2</label>
    <input type="number" id="bilangan2">
    <br><br>
    </div>
    <div class="tombol">
    <button onclick="hitung('+')">+</button>
    <button onclick="hitung('-')">-</button>
    <button onclick="hitung('*')">x</button>
    <button onclick="hitung('/')">/</button>
    <br><br>
    </div>
    <div class="baris">
    <label for="hasil">Output</label>
    <input type="text" id="hasil">
    </div>
    <script>
        function hitung(operator) {
            // mengambil nilai dari input bilangan1 dan bilangan2
            let bilangan1 = parseFloat(document.getElementById("bilangan1").value)
            let bilangan2 = parseFloat(document.getElementById("bilangan2").value)
            
            let hasil 
                if (operator=="+") {
                    hasil = bilangan1 + bilangan2
                }
                else if (operator=="-") {
                    hasil = bilangan1 - bilangan2
                }
                else if (operator=="*") {
                    hasil = bilangan1 * bilangan2
                }
                else if (operator=="/") {
                    hasil = bilangan1 / bilangan2
                }
            // menampilkan hasil output 
            document.getElementById("hasil").value = hasil
        }
    </script>
    </fieldset>
</body>
</html>
