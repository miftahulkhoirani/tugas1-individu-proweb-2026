<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tugas Individu 2</title>
    <link rel="stylesheet" href="tugas-individu2.css" />
  </head>
  <body>
    <form action="#">
      <fieldset>
        <legend><b>Akun</b></legend>
        <table>
          <tr>
            <td><label for="name">Username</label></td>
            <td><input type="text" id="name" /></td>
          </tr>
          <tr>
            <td><label for="password">Password</label></td>
            <td><input type="password" id="password" /></td>
          </tr>
          <tr>
            <td>
              <label for="konfirmasi password">Konfirmasi Password</label>
            </td>
            <td><input type="password" id="konfirmasi password" /></td>
          </tr>
        </table>
      </fieldset>
      <fieldset>
        <legend><b>Data</b></legend>
        <table>
          <tr>
            <td><label for="name">Nama </label></td>
            <td><input type="text" id="name" name="name" /></td>
          </tr>
          <tr>
            <td>Jenis Kelamin</td>
            <td class="checks">
              <input type="radio" id="male" name="gender" value="male" />
              <label for="male">pria</label>
              <br />
              <input type="radio" id="female" name="gender" value="female" />
              <label for="female">wanita</label>
            </td>
          </tr>
          <tr>
            <td>Hobi</td>
            <td class="checks">
              <input type="checkbox" name="bersepeda" id="bersepeda" />
              <label for="bersepeda">Bersepeda</label>
              <br />
              <input type="checkbox" name="jogging" id="jogging" />
              <label for="jogging">Jogging</label>
              <br />
              <input type="checkbox" name="memasak" id="memasak" />
              <label for="memasak">Memasak</label>
              <br />
              <input type="checkbox" name="hiking" id="hiking" />
              <label for="hiking">Hiking</label>
              <br />
              <input type="checkbox" name="riding" id="riding" />
              <label for="riding">Riding</label>
            </td>
          </tr>
          <tr>
            <td>Buah favorit</td>
            <td>
              <label for="buah"></label>
              <select id="buah" name="buah">
                <option value="apel">Apel</option>
                <option value="jeruk">Jeruk</option>
                <option value="mangga">Mangga</option>
                <option value="alpukat">Alpukat</option>
                <option value="semangka">Semangka</option>
              </select>
            </td>
          </tr>
          <tr>
            <td><label for="pesan">Pesan</label></td>
            <td>
              <textarea
                name="textarea"
                id="pesan"
                rows="4"
                cols="10"
              ></textarea>
            </td>
          </tr>
        </table>
      </fieldset>
      <div class="button-group">
        <button type="submit" name="btn-submit" class="submit-button">
          Submit
        </button>
        <button type="reset" name="btn-reset" class="reset-button">
          Reset
        </button>
      </div>
    </form>
  </body>
</html>
